name: CI

on:
  push: { branches: [main, V1] }
  pull_request:

jobs:
  lib:
    name: Library tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Unit tests
        run: node --test "tests/**/*.test.js"

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: dashboard }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

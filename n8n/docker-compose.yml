# n8n + Postgres + Caddy (automatic HTTPS).
#
# Target: an Oracle Cloud "Always Free" ARM VM, which is the only genuinely
# free always-on option. Works unchanged on any Docker host.
#
#   cd n8n && cp .env.example .env && $EDITOR .env && docker compose up -d
#
# See docs/deployment.md for the full walkthrough.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # n8n crashes on boot if Postgres is not accepting connections yet.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- database ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # --- identity / URLs ---
      N8N_HOST: ${N8N_HOST:?N8N_HOST is required, e.g. n8n.example.com}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      GENERIC_TIMEZONE: ${TZ:-Asia/Kolkata}
      TZ: ${TZ:-Asia/Kolkata}

      # --- auth for the n8n editor itself ---
      N8N_BASIC_AUTH_ACTIVE: 'true'
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:?required}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?required}

      # Encrypts stored credentials. CHANGING THIS ORPHANS EVERY SAVED
      # CREDENTIAL — set it once, then back it up somewhere safe.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?required}

      # --- Code node capabilities this project depends on ---
      # Workflow logic reads API keys from the environment rather than storing
      # them in n8n credentials, so env access must be permitted.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      # node:crypto backs the webhook HMAC check. Without it, WF-02/02b/03
      # refuse to run rather than accepting unverified requests.
      NODE_FUNCTION_ALLOW_BUILTIN: 'crypto'

      # --- application secrets, read by the Code nodes ---
      SHEET_ID: ${SHEET_ID:?required}
      GROQ_API_KEY: ${GROQ_API_KEY:?required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?required}
      ALERT_EMAIL: ${ALERT_EMAIL:-}

      # --- housekeeping ---
      # Executions are the main disk consumer on a small VM.
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: 336            # 14 days
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_RUNNERS_ENABLED: 'true'
    volumes:
      - n8n_data:/home/node/.n8n
      # Workflow JSON, mounted read-only for import.
      - ./workflows:/workflows:ro
    expose:
      - '5678'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:5678/healthz || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [n8n]
    ports:
      - '80:80'
      - '443:443'
    environment:
      N8N_HOST: ${N8N_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?required for TLS certificates}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
